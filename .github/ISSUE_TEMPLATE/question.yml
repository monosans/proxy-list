name: ❓ Question
description: Ask how to use proxy-list.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: >-
        Please read the
        [README](https://github.com/monosans/proxy-list#readme) first.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: >-
            I searched the [existing
            issues](https://github.com/monosans/proxy-list/issues?q=is%3Aissue)
            and found nothing about this.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: "What are you trying to do?"
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      render: shell
